<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Happy Birthday 🎂</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="intro" class="intro">
    <div class="intro-card">
      <p>Created by</p>
      <h1>Bixu</h1>
      <h2>Monitor &amp; Smarty</h2>
    </div>
  </div>

  <main id="birthday" class="page hidden">
    <div class="hearts" aria-hidden="true"></div>
    <section class="hero">
      <p class="small">A little surprise for you 💖</p>
      <h1>Happy Birthday! 🎉</h1>
      <p class="message">Wishing you a day full of happiness, smiles, and beautiful memories.</p>

      <div class="cake-stage" aria-label="Birthday cake animation">
        <div class="cake">
          <div class="plate"></div>
          <div class="cake-layer layer-bottom"></div>
          <div class="cake-layer layer-middle"></div>
          <div class="cake-layer layer-top"></div>
          <div class="icing"></div>
          <div class="candle">
            <div class="wick"></div>
            <div class="flame"></div>
          </div>
        </div>
      </div>

      <p class="wish">Make a wish! ✨</p>
      <button id="replay" type="button">Replay cake 🎂</button>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
